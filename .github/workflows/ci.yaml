name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Lint and render
        run: |
          helm lint deploy/helm/righttrain-web -f deploy/homelab/values-homelab.yaml
          helm template righttrain-web deploy/helm/righttrain-web -f deploy/homelab/values-homelab.yaml > /dev/null

      - name: Check config contracts (AASA, nginx, ingress routing)
        run: ./scripts/check-config.sh
