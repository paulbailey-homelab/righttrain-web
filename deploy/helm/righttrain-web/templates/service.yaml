apiVersion: v1
kind: Service
metadata:
  name: {{ include "righttrain-web.fullname" . }}
  labels:
    {{- include "righttrain-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "righttrain-web.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
